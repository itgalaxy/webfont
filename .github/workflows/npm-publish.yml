name: npm publish

# Publishes with the NPM_TOKEN repository secret (see CONTRIBUTING.md).
# Trusted Publishing (OIDC) may replace this when configured on npmjs.com.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g. v12.0.1)
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate published package surface (publint + attw + pack-smoke)
        run: npm run test:package

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org/
          node-auth-token: ${{ secrets.NPM_TOKEN }}
          package-manager-cache: false
      - run: npm ci
      - run: npm publish --access public
