name: Node.js CI

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - run: npm run lint:suppressions
    - run: npm run typecheck
    - run: npm run depcheck
    - run: npm test
    - name: Build VitePress docs site
      run: npm run docs:site
    - name: Validate published package surface (publint + attw + pack-smoke)
      run: npm run test:package
    - name: Publish PR preview (pkg.pr.new)
      if: matrix.node-version == '24.x'
      run: npm exec pkg-pr-new publish './packages/webfont' --bin --comment=update
