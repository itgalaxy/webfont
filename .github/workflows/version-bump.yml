name: Node.js Packages version bump
on:
  push:
    branches: [ master ]

concurrency:
  group: version-bump-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set commit author email
        run: git config --global user.email "development@itgalaxy.company"
      - name: Set commit author name
        run: git config --global user.name "itgalaxy"
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: "0"
      - name: Pull all tags from Lerna semantic release
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/*
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Sync package version with latest git tag
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          node -e "
            const fs = require('fs');
            const semver = require('semver');
            const latest = process.argv[1];
            for (const file of ['package.json', 'package-lock.json']) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (semver.gt(latest, pkg.version)) {
                console.log('Syncing ' + file + ' from ' + pkg.version + ' to ' + latest);
                pkg.version = latest;
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
              }
            }
          " "$LATEST"
      - name: Bump versions and create release
        run: npm run release
      - name: Push release commits and tags
        run: |
          git fetch origin master
          git pull --rebase origin master
          git push --follow-tags origin HEAD:master
