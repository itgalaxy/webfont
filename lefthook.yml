pre-commit:
  commands:
    biome:
      glob: "*.{ts,js,json}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    suppressions:
      run: npm run lint:suppressions

pre-push:
  jobs:
    - group:
        parallel: true
        jobs:
          - run: npm run typecheck
          - run: npm run depcheck
          - run: npm run audit
    - group:
        piped: true
        jobs:
          - run: npm test
          - run: npm run docs:site
