pre-commit:
  commands:
    biome:
      glob: "*.{ts,js,json}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    suppressions:
      run: npm run lint:suppressions

pre-push:
  jobs:
    static-checks:
      parallel: true
      commands:
        typecheck:
          run: npm run typecheck
        depcheck:
          run: npm run depcheck
    verify:
      parallel: false
      commands:
        test:
          run: npm test
        docs-site:
          run: npm run docs:site
