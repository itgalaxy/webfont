# Cosmiconfig v7 YAML parser regression fixture.
# Exercises anchors, aliases, block/flow collections, and YAML 1.1 booleans.

fontName: &fontName config-yaml-advanced

formats: &formats
  - woff2

templateFontPath: './assets/fonts/'
sort: yes
ligatures: false
normalize: on
round: 2

displayName: *fontName
alsoFormats: *formats

# Flow-style collection alongside block mappings.
extraFormats: [woff2]
